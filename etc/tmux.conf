# Mouse support (click to select pane, scroll, drag to resize)
set -g mouse on

# Start window/pane numbering at 1 - 0 is an awkward reach
set -g base-index 1
setw -g pane-base-index 1

# Big scrollback buffer
set -g history-limit 10000

# Vi-style keys in copy mode, since vim is the daily editor
setw -g mode-keys vi

# Default 500ms escape-time makes vim's <Esc> feel laggy inside tmux
set -sg escape-time 10

# Split panes in the current pane's directory instead of $HOME
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Minimal status bar
set -g status-style bg=black,fg=white
set -g status-left ''
set -g status-right '#[fg=cyan]%H:%M '

# Reload config without restarting the session
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
